name: bingo_application_1
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.9.2 # Add flutter_launcher_icons here

flutter:
  uses-material-design: true
  assets:
    - assets/cartelas.json
    - assets/logo.webp

flutter_icons: # This should be outside the flutter section
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" # Path to your app icon image
